<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYKO.COM</title>
    <style>
        /* Base Reset & Dark Minimalist Theme with Subtle Charcoal Background Glow */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #000000;
            background-image: radial-gradient(circle at center, #111111 0%, #000000 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; overflow: hidden; display: flex;
            flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px;
        }
        header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .nav-btn {
            background: none; border: 1px solid rgba(255, 255, 255, 0.4); color: #ffffff;
            padding: 8px 24px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
            border-radius: 50px; cursor: pointer; transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background-color: #ffffff; color: #000000; border-color: #ffffff; transform: scale(1.05); }
        
        /* Main Hero Center Container */
        main { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 5; }
        main h1 { font-size: clamp(2rem, 6vw, 4.5rem); font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; line-height: 1.1; }
        .hero-subtitle { font-size: calc(clamp(2rem, 6vw, 4.5rem) * 0.25); color: #888888; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 12px; font-weight: 400; }
        
        footer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 30px; z-index: 10; }
        .shop-trigger { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; background: none; border: none; color: #ffffff; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .shop-trigger:hover { color: #aaaaaa; letter-spacing: 0.25em; }
        .stamp-container { width: 90px; height: 90px; cursor: pointer; background: none; border: none; color: #ffffff; padding: 0; outline: none; }
        .stamp-graphic { width: 100%; height: 100%; fill: #ffffff; animation: spin 20s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* Master Overlays Engine */
        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px;
            opacity: 0; pointer-events: none; transform: translateY(40px); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fullscreen-overlay.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .menu-logo { font-family: "Courier New", Courier, monospace; font-size: 28px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.2); }
        .menu-stack { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; margin: auto 0; }
        
        /* Kinetic Motion Actions on Pill Buttons */
        .menu-btn {
            width: 100%; background: none; border: 1px solid rgba(255, 255, 255, 0.25); color: #ffffff;
            padding: 16px 20px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; border-radius: 50px;
            cursor: pointer; text-decoration: none; text-align: center; transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); display: inline-flex; align-items: center; justify-content: center;
        }
        .menu-btn:hover { border-color: rgba(255, 255, 255, 0.8); background-color: rgba(255, 255, 255, 0.04); transform: translateY(-3px) scale(1.02); }
        .circle-close-btn { width: 75px; height: 75px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; background: none; color: #ffffff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; margin-top: 20px; }
        .circle-close-btn:hover { border-color: #ffffff; transform: scale(1.05); }
        
        /* Tour Layout Structures */
        .tour-header { width: 100%; max-width: 600px; text-align: center; margin-bottom: 20px; }
        .tour-title { font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; }
        .tour-list { width: 100%; max-width: 600px; height: 100%; overflow-y: auto; margin-bottom: 20px; }
        .tour-row { display: flex; justify-content: space-between; align-items: center; padding: 25px 0; border-bottom: 1px solid #1c1c1c; font-size: 13px; }
        .tour-date-details { display: flex; gap: 25px; align-items: center; text-align: left; }
        .tour-date { color: #888888; width: 90px; font-weight: bold; font-size: 11px; line-height: 1.4; letter-spacing: 0.05em; }
        .tour-venue { font-weight: 500; line-height: 1.4; }
        .ticket-btn { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 6px 16px; font-size: 10px; text-transform: uppercase; border-radius: 3px; transition: all 0.2s; background: none; cursor: pointer; }
        .ticket-btn:hover { background-color: #ffffff; color: #000000; }
        
        /* Brutalist Confirmation Elements */
        .confirm-card { border: 1px dashed #ffffff; padding: 30px; border-radius: 8px; background: #000000; width: 100%; max-width: 400px; text-align: center; }
        .confirm-action-btn { width: 100%; padding: 16px; font-size: 12px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.2s; margin-top: 25px; }
        .confirm-action-btn.black-white { background: #ffffff; color: #000000; border: 1px solid #ffffff; }
        .confirm-action-btn.black-white:hover { background: #000000; color: #ffffff; }
        .brutalist-barcode { width: 100%; height: 50px; margin: 15px 0 5px 0; border-radius: 2px; background: repeating-linear-gradient(90deg, #ffffff, #ffffff 2px, #000000 2px, #000000 6px, #ffffff 6px, #ffffff 8px, #000000 8px, #000000 13px); }

        /* Working Email Form Component Layout styles */
        .email-form-container { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; text-align: center; margin: auto 0; }
        .email-input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; padding: 16px 24px; color: #fff; text-align: center; font-size: 13px; font-family: monospace; outline: none; transition: border-color 0.3s; }
        .email-input:focus { border-color: #ffffff; }
    </style>
</head>
